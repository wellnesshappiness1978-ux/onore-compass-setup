name: Build and Deploy to App Store Connect

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/core @capacitor/ios @capacitor/cli --legacy-peer-deps

      - name: Build Web Assets
        run: |
          mkdir -p dist
          npm run build || true

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Configure Xcode Signing Settings
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -c "
          import re
          path = 'ios/App/App.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};', content)
          content = re.sub(r'DevelopmentTeam = [^;]*;', f'DevelopmentTeam = ${APPLE_TEAM_ID};', content)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build and Upload with Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_DISABLE_COLORS: "true"
        run: |
          cd ios/App
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)
          platform :ios do
            desc "Build and upload to App Store Connect"
            lane :release do
              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_filepath: "~/.appstoreconnect/private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_KEY_ID']}.p8",
                duration: 1200,
                in_house: false
              )

              # キーチェーン作成
              create_keychain(
                name: "fastlane_keychain",
                password: "temporary_password",
                default_keychain: true,
                unlock: true,
                timeout: 3600
              )

              # プロビジョニングプロファイルの取得／新規自動生成
              # (force: true で必要に応じて新規生成)
              get_provisioning_profile(
                api_key: api_key,
                app_identifier: "com.agolmen.compass",
                force: true
              )

              # ビルド実行（自動プロビジョニング更新オプションを併用）
              build_app(
                project: "App.xcodeproj",
                scheme: "App",
                export_method: "app-store",
                clean: true,
                xcargs: "-allowProvisioningUpdates",
                export_xcargs: "-allowProvisioningUpdates",
                export_options: {
                  signingStyle: "automatic",
                  teamID: ENV["APPLE_TEAM_ID"]
                }
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF
          fastlane release
