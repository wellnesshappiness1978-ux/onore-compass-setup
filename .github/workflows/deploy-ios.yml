name: Build and Deploy to App Store Connect

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/core @capacitor/ios @capacitor/cli --legacy-peer-deps

      - name: Build Web Assets
        run: |
          mkdir -p dist
          npm run build || true

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Align Xcode Signing Settings to Distribution
        env:
          APPLE_TEAM_ID: "25478AQH7N"
        run: |
          python3 -c "
          import re
          path = 'ios/App/App.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          # チームIDを注入
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = 25478AQH7N;', content)
          content = re.sub(r'DevelopmentTeam = [^;]*;', f'DevelopmentTeam = 25478AQH7N;', content)
          # 署名スタイルをManualに統一して自動署名との衝突を完全防止
          content = re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', content)
          content = re.sub(r'ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;', content)
          # 署名アイデンティティを Apple Distribution に設定
          content = re.sub(r'\"CODE_SIGN_IDENTITY\\[sdk=iphoneos\*\\]\" = [^;]*;', '\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";', content)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build and Upload via Xcode CLI
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: "25478AQH7N"
        run: |
          cd ios/App
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          # 1. ExportOptions.plist の作成（App Store直接配布用）
          cat << EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "[suspicious link removed]">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>destination</key>
              <string>upload</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 2. アーカイブ作成（Generic iOS Device 向けにReleaseビルド）
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          # 3. App Store Connect / TestFlight へアップロード
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
