name: Build and Deploy to App Store Connect

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/core @capacitor/ios @capacitor/cli --legacy-peer-deps

      - name: Build Web Assets
        run: |
          mkdir -p dist
          npm run build || true

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Install Fastlane & xcodeproj
        run: gem install fastlane xcodeproj --no-document

      - name: Set Team ID Safely
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ruby -r xcodeproj -e '
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            team_id = ENV["APPLE_TEAM_ID"]
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["DEVELOPMENT_TEAM"] = team_id
                config.build_settings["CODE_SIGN_STYLE"] = "Automatic"
              end
            end
            project.root_object.attributes["TargetAttributes"] ||= {}
            project.targets.each do |target|
              project.root_object.attributes["TargetAttributes"][target.uuid] ||= {}
              project.root_object.attributes["TargetAttributes"][target.uuid]["DevelopmentTeam"] = team_id
              project.root_object.attributes["TargetAttributes"][target.uuid]["ProvisioningStyle"] = "Automatic"
            end
            project.save
          '

      - name: Build and Upload with Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_DISABLE_COLORS: "true"
        run: |
          cd ios/App
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)
          platform :ios do
            desc "Build and upload to App Store Connect"
            lane :release do
              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_filepath: "~/.appstoreconnect/private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_KEY_ID']}.p8",
                duration: 1200,
                in_house: false
              )

              build_app(
                project: "App.xcodeproj",
                scheme: "App",
                export_method: "app-store",
                clean: true,
                export_options: {
                  signingStyle: "automatic",
                  teamID: ENV["APPLE_TEAM_ID"]
                }
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF
          fastlane release
