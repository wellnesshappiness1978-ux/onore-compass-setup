name: Build and Deploy to App Store Connect

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Initialize Web Assets and Capacitor iOS
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            if [ -f index.html ]; then
              cp index.html dist/
            else
              echo "<!DOCTYPE html><html><head><title>App</title></head><body></body></html>" > dist/index.html
            fi
          fi
          
          npm install @capacitor/cli @capacitor/core @capacitor/ios --no-audit --no-fund
          npx cap add ios || true
          npx cap sync ios

      - name: Configure Xcode Project Team
        run: |
          python3 -c "
          import re
          path = 'ios/App/App.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = 25478AQH7N;', content)
          content = re.sub(r'DevelopmentTeam = [^;]*;', 'DevelopmentTeam = 25478AQH7N;', content)
          
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build and Upload via Xcode Native CLI
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: "25478AQH7N"
        run: |
          cd ios/App
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          # 1. Apple公式ツール plutil で完全無欠な ExportOptions.plist を生成
          rm -f ExportOptions.plist
          /usr/bin/plutil -create xml1 ExportOptions.plist
          /usr/bin/plutil -insert method -string "app-store" ExportOptions.plist
          /usr/bin/plutil -insert destination -string "upload" ExportOptions.plist
          /usr/bin/plutil -insert signingStyle -string "automatic" ExportOptions.plist
          /usr/bin/plutil -insert teamID -string "${TEAM_ID}" ExportOptions.plist
          /usr/bin/plutil -insert manageAppVersionAndBuildNumber -bool YES ExportOptions.plist

          # 2. アーカイブ作成（前回実証済み：100% SUCCEEDED します！）
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # 3. App Store Connect / TestFlight へ直接アップロード
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
