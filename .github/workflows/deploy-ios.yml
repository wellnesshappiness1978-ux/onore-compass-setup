name: Build and Deploy to App Store Connect

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Initialize Web Assets and Capacitor iOS
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            if [ -f index.html ]; then
              cp index.html dist/
            else
              echo "<!DOCTYPE html><html><head><title>App</title></head><body></body></html>" > dist/index.html
            fi
          fi
          
          npm install @capacitor/cli @capacitor/core @capacitor/ios --no-audit --no-fund
          npx cap add ios || true
          npx cap sync ios

      - name: Build and Upload via Xcode Native CLI
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: "25478AQH7N"
        run: |
          cd ios/App
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          # 1. ExportOptions.plist の作成
          cat << EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "[suspicious link removed]">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>destination</key>
              <string>upload</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 2. アーカイブ作成（DEVELOPMENT_TEAM を引数で直接Xcodeに強制適用）
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="${TEAM_ID}"

          # 3. App Store Connect / TestFlight へ直接アップロード
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
